<section class="contacto-info">
    <div id="info-container">
        <div>
            <h2>Nuestro equipo estará encantado de ayudarte con lo que necesites. No dudes en llamarnos, escribirnos o
                venir a nuestra tienda física:</h2>
        </div>
        <div id="metodos-contacto-container"></div>
    </div>
    <div id="mapa-container">
        <img src="../assets/img/fake_mapa.png" alt="ubicación maps">

<section class="contacto-formulario">
    <h2>Formulario de contacto</h2>
<!--    <div id="formulario-container">-->
        <form id="contact-form" method="POST">
<!--                            <label for="nombre">Nombre completo</label>-->
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            <!--                <label for="email">Correo electrónico</label>-->
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            <!--                <label for="telefono">Teléfono</label>-->
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 600 000 000">
            <!--                <label for="fecha">Fecha del evento</label>-->
            <input type="date" id="fecha" name="fecha">
            <!--                <label for="mensaje">Mensaje</label>-->
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos cómo podemos ayudarte" required></textarea>
            <input type="submit" class="boton-1"/>
        </form>

<!--    </div>-->
</section>
