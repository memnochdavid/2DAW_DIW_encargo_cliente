<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pétalo&Co</title>
    <link rel="stylesheet" href="./assets/css/main.css">
    <script src="./assets/js/productos.js" defer></script>
    <script src="./assets/js/sesion.js" defer></script>
    <script src="./assets/js/carrito.js" defer></script>
    <script src="./assets/js/cookies.js" defer></script>
    <script src="./assets/js/menu.js" defer></script>
    <script src="./assets/js/footer.js" defer></script>
    <script src="./assets/js/app.js" defer></script>
</head>
<body>
<header>
    <div class="mini-banner">
        <p>ENVÍOS DE COMPRAS ONLINE EXCLUSIVAMENTE A GRANADA CAPITAL.</p>
    </div>

    <div class="menu">
        <button id="menu-button" aria-expanded="false">
            <img src="./assets/img/menu.svg" alt="Abrir menú">
        </button>

        <div class="logo">
            <a href="?page=inicio">
                <picture>
                    <!--pequeñas -->
                    <source srcset="./assets/img/logo_texto.png" media="(max-width: 768px)">
                    <!--por defecto -->
                    <img src="./assets/img/logo.png" alt="Logo de Pétalo&Co">
                </picture>
            </a>
        </div>

<!--        botones para mostrar los diálogos flotantes-->
        <div class="iconos">

            <!--        iniciar sesión-->
            <a href="javascript:void(0);" id="abrirDialogoUsuario">
                <img src="./assets/img/user.png" alt="Perfil de usuario">
            </a>

            <!--        carrito-->
            <a href="javascript:void(0);" id="abrirDialogoCarrito">
                <img src="./assets/img/cart.svg" alt="Carrito de compra">
                <span id="contador-carrito" class="contador-carrito">0</span>
            </a>
        </div>

<!--        diálogos ocultos-->


<!--        iniciar sesión-->
        <dialog id="dialogoUsuario" class="dialogo-flotante">
            <div class="dialogo-contenido">
                <h3>Acceso de Usuario</h3>
                <p>Inicia sesión para poder disfrutar de todas las ventajas.</p>

                <form>
                    <input type="email" placeholder="Correo Electrónico" required>
                    <input type="password" placeholder="Contraseña" required>
                    <input type="submit" class="boton-1" value="Iniciar Sesión"/>
                </form>

            </div>
        </dialog>

<!--        carrito-->
        <dialog id="dialogoCarrito" class="dialogo-flotante">
            <div class="dialogo-contenido">
                <h3>Tu carrito</h3>
                <div id="carrito-contenido"></div>
                <div class="carrito-total">
                    <p><strong>Total:</strong> <span id="carrito-total">0 €</span></p>
                </div>
                <div class="carrito-acciones">
                    <button class="boton-1" id="vaciarCarrito">Vaciar</button>
                    <button class="boton-1">Finalizar compra</button>
                </div>
            </div>
        </dialog>

        <!-- cookies -->
        <dialog id="cookieDialog" class="dialogo-flotante">
            <div class="cookie-content">
                <button id="cerrarCookies">X</button>
                <p>
                    Utilizamos cookies para mejorar tu experiencia en nuestro sitio.
                    Al continuar navegando, aceptas nuestra política de cookies.
                </p>
                <div class="cookie-buttons">
                    <button id="aceptarCookies" class="boton-1">Aceptar</button>
                    <button id="rechazarCookies" class="boton-1">Rechazar</button>
                </div>
            </div>
        </dialog>



    </div>

    <nav>
        <ul id="objetos-menu" class="objetos-menu">
            <!--contenido dinámico ;)-->
        </ul>
    </nav>
</header>

<main>
<!--contenido dinámico ;)-->
</main>
<footer>
    <div id="copyright">
        <!--contenido dinámico ;)-->
    </div>
</footer>
</body>
</html>
