<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pétalo&Co</title>
    <link rel="stylesheet" href="./assets/css/main.css">
    <script src="./assets/js/productos.js" defer></script>
    <script src="./assets/js/menu.js" defer></script>
    <script src="./assets/js/footer.js" defer></script>
    <script src="./assets/js/objetosMenu.js" defer></script>
    <script src="./assets/js/app.js" defer></script>
</head>
<body>
<header>
    <div class="mini-banner">
        <p>ENVÍOS DE COMPRAS ONLINE EXCLUSIVAMENTE A GRANADA CAPITAL.</p>
    </div>

    <div class="menu">
        <button id="menu-button" aria-expanded="false">
            <img src="./assets/img/menu.svg" alt="Abrir menú">
        </button>

        <div class="logo">
            <a href="?page=inicio">
                <picture>
                    <!--pequeñas -->
                    <source srcset="./assets/img/logo_texto.png" media="(max-width: 768px)">
                    <!--por defecto -->
                    <img src="./assets/img/logo.png" alt="Logo de Pétalo&Co">
                </picture>
            </a>
        </div>

        <div class="iconos">
            <a href="#"><img src="./assets/img/user.png" alt="Perfil de usuario"></a>
            <a href="#"><img src="./assets/img/cart.svg" alt="Carrito de compra"></a>
        </div>
    </div>

    <nav>
        <ul id="objetos-menu" class="objetos-menu"></ul>
    </nav>
</header>

<main>
<!--contenido dinámico ;)-->
</main>
<footer>
    <div></div>
    <div id="copyright"></div>
</footer>
</body>
</html>
